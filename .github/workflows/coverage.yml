name: Coverage

on:
  push:
    branches: [main, master]
    paths:
      - src/**
      - src_rust/**
      - tests/**
      - Cargo.toml
      - pyproject.toml
      - mise.toml
      - mise.lock
      - .github/workflows/coverage.yml

  pull_request:

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v3
        env:
          MISE_LOCKED: 1

      - name: Run coverage
        run: mise run coverage
        env:
          MISE_LOCKED: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          use_oidc: true
          fail_ci_if_error: true
          verbose: true
